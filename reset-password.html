
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Восстановление пароля — TEAR LIST</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border-radius: 18px;
      background: #1f2937;
    }
    h1 { margin-top: 0; font-size: 25px; }
    p { color: #cbd5e1; line-height: 1.5; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
    }
    input { background: #374151; color: white; }
    button {
      background: #65a9ff;
      color: #101827;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    #message { margin-top: 16px; overflow-wrap: anywhere; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Новый пароль</h1>
    <p id="status">Проверяем ссылку восстановления...</p>

    <form id="passwordForm" class="hidden">
      <input
        id="password"
        type="password"
        placeholder="Новый пароль"
        minlength="6"
        required
        autocomplete="new-password"
      >
      <input
        id="confirmPassword"
        type="password"
        placeholder="Повторите новый пароль"
        minlength="6"
        required
        autocomplete="new-password"
      >
      <button id="saveButton" type="submit">Сохранить новый пароль</button>
    </form>

    <p id="message"></p>
  </main>

  <script>
    const SUPABASE_URL = 'https://qbcqsfdygoyvthvjmhvi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_HGHRx0sT5jgU-Kkg6yU_bw_g3exj4uW';

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const statusText = document.getElementById('status');
    const form = document.getElementById('passwordForm');
    const message = document.getElementById('message');
    const saveButton = document.getElementById('saveButton');

    let recoveryReady = false;

    function enablePasswordForm() {
      if (recoveryReady) return;
      recoveryReady = true;
      statusText.textContent = 'Ссылка подтверждена. Придумайте новый пароль.';
      form.classList.remove('hidden');
    }

    db.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) {
        enablePasswordForm();
      }
    });

    async function checkRecoverySession() {
      const { data, error } = await db.auth.getSession();

      if (error) {
        statusText.textContent = 'Не удалось проверить ссылку.';
        message.textContent = error.message;
        return;
      }

      const hasRecoveryMarker =
        window.location.hash.includes('type=recovery') ||
        new URLSearchParams(window.location.search).has('code');

      if (data.session && hasRecoveryMarker) {
        enablePasswordForm();
      } else if (!recoveryReady) {
        statusText.textContent =
          'Ссылка ещё не подтверждена или уже недействительна. Запросите новое письмо восстановления.';
      }
    }

    checkRecoverySession();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        message.textContent = 'Пароли не совпадают.';
        return;
      }

      if (password.length < 6) {
        message.textContent = 'Пароль должен содержать не менее 6 символов.';
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = 'Сохраняем...';
      message.textContent = '';

      const { error } = await db.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = 'Ошибка: ' + error.message;
        saveButton.disabled = false;
        saveButton.textContent = 'Сохранить новый пароль';
        return;
      }

      form.classList.add('hidden');
      statusText.textContent = 'Пароль успешно изменён!';
      message.textContent = 'Теперь можно войти в админку с новым паролем.';
    });
  </script>
</body>
</html>
