
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тир-лист</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 16px;
      background: #10131b;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 1000px;
      margin: auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #65a9ff;
      text-decoration: none;
    }

    h1 {
      text-align: center;
      margin: 10px 0 30px;
    }

    #cards {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: 100%;
    }

    .card {
      width: 100%;
      overflow: hidden;
      border-radius: 16px;
      background: #202839;
      border: 1px solid #35445e;
    }

    .card img {
      display: block;
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #182131;
    }

    .card-content {
      padding: 22px;
      line-height: 1.6;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    .card p {
      margin: 8px 0;
      white-space: pre-wrap;
    }

    .empty, .status {
      text-align: center;
      padding: 35px 20px;
      color: #929bad;
      background: #202839;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px 12px;
      }

      .card img {
        height: 220px;
      }

      .card-content {
        padding: 17px;
      }
    }
  </style>
</head>

<body>
  <main>
    <a class="back" href="index.html">← На главную</a>

    <h1>Тир-лист</h1>

    <div id="cards">
      <div class="status">Загружаем карточки...</div>
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      'https://qbcqsfdygoyvthvjmhvi.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_HGHRx0sT5jgU-Kkg6yU_bw_g3exj4uW';

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const cardsContainer = document.getElementById('cards');

    async function loadCards() {
      const { data, error } = await db
        .from('tier_items')
        .select('*')
        .eq('kind', 'regular')
        .order('position', { ascending: true });

      if (error) {
        cardsContainer.innerHTML =
          '<div class="empty">Не удалось загрузить карточки. Проверьте подключение и права доступа к базе.</div>';
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        cardsContainer.innerHTML =
          '<div class="empty">Пока здесь нет карточек. Скоро они появятся!</div>';
        return;
      }

      cardsContainer.innerHTML = '';

      data.forEach(item => {
        const card = document.createElement('article');
        card.className = 'card';

        if (item.image_url) {
          const img = document.createElement('img');
          img.src = item.image_url;
          img.alt = item.title || 'Фотография карточки';
          img.loading = 'lazy';
          card.appendChild(img);
        }

        const content = document.createElement('div');
        content.className = 'card-content';
        content.style.color = item.text_color || '#65A9FF';

        if (item.title) {
          const title = document.createElement('h2');
          title.textContent = item.title;
          content.appendChild(title);
        }

        if (item.description) {
          const description = document.createElement('p');
          description.textContent = item.description;
          content.appendChild(description);
        }

        if (item.verifier) {
          const verifier = document.createElement('p');
          verifier.textContent = 'Верификация: ' + item.verifier;
          content.appendChild(verifier);
        }

        if (item.victories) {
          const victories = document.createElement('p');
          victories.textContent = 'Виктору: ' + item.victories;
          content.appendChild(victories);
        }

        card.appendChild(content);
        cardsContainer.appendChild(card);
      });
    }

    loadCards();
  </script>
</body>
</html>
